; PlatformIO Project Configuration File
; Waveshare ESP32-S3-POE-ETH-8DI-8RO

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; Force Arduino Core 3.x which has W5500 support
platform_packages =
    platformio/framework-arduinoespressif32 @ ~3.20017.0

; Filesystem für Webinterface
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv

; Monitoring
monitor_speed = 115200

; Libraries - use latest compatible versions
; AsyncTCP and ESPAsyncWebServer listed FIRST to control versions
lib_deps =
    ESP32Async/AsyncTCP@^3.4.0
    ESP32Async/ESPAsyncWebServer@^3.9.0
    bblanchon/ArduinoJson@^7.0.0
    ayushsharma82/ElegantOTA@^3.1.0
    adafruit/Adafruit NeoPixel@^1.12.0
    ; khoih-prog/Ethernet_Generic@^2.8.1  ; TEMPORARILY DISABLED

; Prevent PlatformIO from pulling in conflicting library versions
lib_compat_mode = strict

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
