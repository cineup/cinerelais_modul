; PlatformIO Project Configuration File
; Waveshare ESP32-S3-POE-ETH-8DI-8RO

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; Force Arduino Core 3.x
platform_packages =
    platformio/framework-arduinoespressif32@^3.20017.0

; Filesystem für Webinterface
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv

; Monitoring
monitor_speed = 115200

; Libraries - use Arduino Core 3.x compatible versions
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    ayushsharma82/ElegantOTA@^3.1.0
    mathieucarbou/AsyncTCP@^3.2.14
    mathieucarbou/ESPAsyncWebServer@^3.4.5
    adafruit/Adafruit NeoPixel@^1.12.0

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
