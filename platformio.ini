; PlatformIO Project Configuration File
; Waveshare ESP32-S3-POE-ETH-8DI-8RO

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; Force Arduino Core 3.x which has W5500 support
platform_packages =
    platformio/framework-arduinoespressif32 @ ~3.20017.0

; Filesystem für Webinterface
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv

; Monitoring
monitor_speed = 115200

; Libraries - use latest compatible versions (3.4.x AsyncTCP + 3.9.x ESPAsyncWebServer)
; These must be listed FIRST to override ElegantOTA's transitive dependencies
lib_deps =
    mathieucarbou/AsyncTCP@^3.4.0
    mathieucarbou/ESPAsyncWebServer@^3.9.0
    bblanchon/ArduinoJson@^7.0.0
    ayushsharma82/ElegantOTA@^3.1.0
    adafruit/Adafruit NeoPixel@^1.12.0
    arduino-libraries/Ethernet@^2.0.2

; Prevent PlatformIO from pulling in conflicting library versions
lib_compat_mode = strict

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
