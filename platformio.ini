; CineRelais Controller - PlatformIO Configuration
; Waveshare ESP32-S3-POE-ETH-8DI-8RO

[env:esp32s3]
; Use pioarduino platform for Arduino Core 3.x with native W5500 support
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; Filesystem for web interface (uses default partition table)
board_build.filesystem = littlefs

monitor_speed = 115200

lib_deps =
    ESP32Async/AsyncTCP@^3.4.0
    ESP32Async/ESPAsyncWebServer@^3.9.0
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^7.0.0
    ayushsharma82/ElegantOTA@^3.1.0
    4-20ma/ModbusMaster@^2.0.1

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
